name: Deploy to Production

# Triggers the production deploy and verifies the live service.
#
# Render rebuilds from the connected branch using render.yaml, so this
# workflow does not push an image. It fires the service's deploy hook,
# waits for the rollout, and then checks that the live service is
# serving the full API.
#
# The hook URL is a per-service secret stored as a repository secret so
# it does not appear in the history.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Algorise AI Container Build & Publish"]
    types: [completed]

permissions:
  contents: read
  packages: read
  deployments: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy and Verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://algorise-ai-backend.onrender.com
    steps:
    - name: Check the build succeeded
      if: github.event_name == 'workflow_run'
      run: |
        if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
          echo "::error::the container build did not succeed, not deploying"
          exit 1
        fi

    - name: Trigger the Render deploy hook
      env:
        RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      run: |
        if [ -z "$RENDER_DEPLOY_HOOK" ]; then
          echo "::error::RENDER_DEPLOY_HOOK is not configured"
          echo "Add the service's deploy hook URL as a repository secret:"
          echo "  Render dashboard -> the service -> Settings -> Deploy Hooks"
          exit 1
        fi
        # Render rebuilds from the connected branch. The hook is what
        # tells it to start that rebuild.
        curl -fsS -X POST "$RENDER_DEPLOY_HOOK" -o /dev/null -w "hook status: %{http_code}\n"

    - name: Wait for the service to roll out
      run: |
        # Render rebuilds and restarts the service. Poll until the new
        # readiness endpoint answers, which only the current code serves.
        ready=0
        for i in $(seq 1 60); do
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            https://algorise-ai-backend.onrender.com/readyz || true)
          if [ "$code" = "200" ]; then
            ready=1
            echo "the service is ready"
            break
          fi
          echo "attempt $i: /readyz returned $code"
          sleep 15
        done
        if [ "$ready" -ne 1 ]; then
          echo "::error::the service did not become ready"
          exit 1
        fi

    - name: Verify the live service
      run: |
        set -e
        echo "--- health ---"
        curl -fsS https://algorise-ai-backend.onrender.com/health
        echo
        echo "--- readiness ---"
        curl -fsS https://algorise-ai-backend.onrender.com/readyz
        echo
        echo "--- served routes ---"
        count=$(curl -fsS https://algorise-ai-backend.onrender.com/openapi.json \
          | python -c "import json,sys; print(len(json.load(sys.stdin)['paths']))")
        echo "paths served: $count"
        if [ "$count" -lt 60 ]; then
          echo "::error::the live service serves only $count paths"
          exit 1
        fi
        echo "--- metrics ---"
        curl -fsS https://algorise-ai-backend.onrender.com/metrics | head -5
