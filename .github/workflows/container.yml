name: Algorise AI Container Build & Publish

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  build:
    name: Build, Scan and Publish Image
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and Push Image by Digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ./Dockerfile
        push: ${{ github.event_name != 'pull_request' }}
        # push-by-digest publishes the content-addressed ref only. Tag refs
        # cannot be pushed in the same invocation, so tags are attached by a
        # separate step after the digest is known.
        outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        provenance: true
        sbom: true

    - name: Extract Image Digest
      id: digest
      run: |
        digest="${{ steps.build.outputs.digest }}"
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"

    - name: Attach Tag References to the Published Digest
      if: github.event_name != 'pull_request'
      run: |
        digest="${{ steps.build.outputs.digest }}"
        for tag in "${GITHUB_SHA}" "latest"; do
          # The digest ref already exists in the registry; a tag ref is a
          # pointer to it, so no rebuild is required.
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${tag}" \
            "ghcr.io/${{ github.repository }}@${digest}"
        done
        docker buildx imagetools inspect "ghcr.io/${{ github.repository }}@${digest}"

    - name: Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        format: spdx-json
        output-file: sbom.spdx.json

    - name: Upload SBOM Artifact
      uses: actions/upload-artifact@v4
      with:
        name: sbom-${{ github.sha }}
        path: sbom.spdx.json

    - name: Trivy Image Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH
        # Only vulnerabilities with an available fix block the build.
        # Base-image OS advisories without a fix cannot be remediated by
        # this repository, and gating on them makes the pipeline permanently
        # red while providing no signal.
        ignore-unfixed: true
        exit-code: '1'
        # The vulnerability scan is the gate. Secret scanning across the
        # whole filesystem surfaces historical and example values from
        # development data rather than deployed credentials.
        scanners: vuln

    - name: Upload Trivy Results
      if: always()
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results.sarif
        category: trivy-image

    - name: Container Smoke Test
      run: |
        set -x
        docker pull ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        # --rm is deliberately not used: it deletes the container the moment
        # it exits, which destroys the log that explains the failure.
        docker run -d --name smoke -p 8099:8000 \
          -e ENVIRONMENT=production \
          -e MIGRATE_ON_START=false \
          -e REDIS_REQUIRED=false \
          -e ENABLE_EMBEDDED_SCHEDULER=false \
          -e SECRET_KEY=smoke-test-not-a-real-secret \
          -e ADMIN_SECRET=smoke-test-not-a-real-secret \
          -e FB_APP_SECRET=smoke-test-not-a-real-secret \
          ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

        ready=0
        for i in $(seq 1 45); do
          if curl -fsS http://127.0.0.1:8099/livez > /dev/null 2>&1; then
            ready=1
            break
          fi
          if ! docker ps --filter name=smoke --format '{{.Names}}' | grep -q smoke; then
            echo "::group::Container exited before becoming ready"
            docker logs smoke || true
            echo "exit status:"
            docker inspect smoke --format '{{.State.ExitCode}} {{.State.Error}} {{.State.OOMKilled}}' || true
            echo "::endgroup::"
            exit 1
          fi
          sleep 2
        done

        if [ "$ready" -ne 1 ]; then
          echo "::group::Container never became ready"
          docker logs smoke || true
          docker inspect smoke --format '{{.State.ExitCode}} {{.State.Error}}' || true
          echo "::endgroup::"
          exit 1
        fi

        curl -fsS http://127.0.0.1:8099/livez
        curl -fsS http://127.0.0.1:8099/readyz
        docker rm -f smoke
