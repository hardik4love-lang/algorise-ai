name: "ModernizeAI: Autonomous SDK Upgrade & Codemod Gate"

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Target package to upgrade (e.g. pydantic, datetime, langchain)'
        required: true
        default: 'datetime'
      target_version:
        description: 'Target version specification (e.g. 3.12, 2.0, 0.3)'
        required: false
        default: ''
      apply_write:
        description: 'Apply changes and commit branch (true/false)'
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  modernize-audit:
    name: "Autonomous AST Codemod Transformation"
    runs-on: ubuntu-latest
    env:
      PKG_NAME: ${{ github.event.inputs.package_name }}
      TARGET_VER: ${{ github.event.inputs.target_version }}
      APPLY_WRITE: ${{ github.event.inputs.apply_write }}
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Step 1 - Synthesize Migration Plan
        run: |
          echo "Synthesizing AST migration plan for $PKG_NAME..."
          TARGET_FLAG=""
          if [ -n "$TARGET_VER" ]; then
            TARGET_FLAG="--to $TARGET_VER"
          fi
          python -m modernize_ai.cli plan --package "$PKG_NAME" $TARGET_FLAG

      - name: Step 2 - Execute Codemods & Generate Diff
        run: |
          TARGET_FLAG=""
          if [ -n "$TARGET_VER" ]; then
            TARGET_FLAG="--to $TARGET_VER"
          fi
          WRITE_FLAG=""
          if [ "$APPLY_WRITE" = "true" ]; then
            WRITE_FLAG="--write"
          fi
          python -m modernize_ai.cli apply --package "$PKG_NAME" $TARGET_FLAG $WRITE_FLAG --output modernize_report.md
          cat modernize_report.md >> $GITHUB_STEP_SUMMARY
          cat modernize_report.md

      - name: Step 3 - Regression Verification (If Modified)
        if: github.event.inputs.apply_write == 'true'
        run: |
          echo "Executing test suite against modernized AST..."
          python -m pytest tests/ -o addopts=""

      - name: Step 4 - Stage & Open Automated Migration PR
        if: github.event.inputs.apply_write == 'true'
        run: |
          git config user.name "modernize-ai[bot]"
          git config user.email "modernize@algorise.ai"
          BRANCH_NAME="modernize-ai/upgrade-$PKG_NAME-$(date +%s)"
          git checkout -b "$BRANCH_NAME"
          git add -A
          if git diff-index --quiet HEAD; then
            echo "No AST changes needed; codebase already modernized."
          else
            git commit -m "chore(deps): autonomous AST upgrade for $PKG_NAME"
            git push origin "$BRANCH_NAME"
            echo "Pushed migration branch $BRANCH_NAME"
          fi
