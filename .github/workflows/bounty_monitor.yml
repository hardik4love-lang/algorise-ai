name: "Bounty Hunter & Triage Engine (read-only discovery)"

# Discovery only. This workflow never submits a pull request, a security
# report, or a bounty claim, and it never pushes to a protected branch.
# Candidate findings are written to the job summary and as workflow
# artifacts for human triage.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bounty-hunt
  cancel-in-progress: false

jobs:
  hunt:
    name: "Discovery & Triage"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Discovery Cycle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/hunt_bounties_247.py
          if [ -f bounty_radar.md ]; then
            cat bounty_radar.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Discovery Ledger
        uses: actions/upload-artifact@v4
        with:
          name: bounty-radar-${{ github.run_id }}
          path: |
            bounty_radar.json
            bounty_radar.md
          if-no-files-found: ignore
          retention-days: 14
