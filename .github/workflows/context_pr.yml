name: "ContextPR: Semantic Blast-Radius & Contract Review"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [master, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  context-pr-audit:
    name: "Semantic Blast-Radius & Invariant Gate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Determine Diff Baseline
        id: diff_base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "BASE_REF=origin/$PR_BASE_REF" >> $GITHUB_ENV
            echo "HEAD_REF=origin/$PR_HEAD_REF" >> $GITHUB_ENV
          else
            echo "BASE_REF=HEAD~1" >> $GITHUB_ENV
            echo "HEAD_REF=HEAD" >> $GITHUB_ENV
          fi

      - name: Run ContextPR Semantic Review
        run: |
          python -m context_pr.cli \
            --base "$BASE_REF" \
            --head "$HEAD_REF" \
            --output context_pr_review.md
          if [ -f context_pr_review.md ]; then
            cat context_pr_review.md >> $GITHUB_STEP_SUMMARY
            cat context_pr_review.md
          fi

      - name: Post ContextPR Comment to Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('context_pr_review.md')) {
              const reviewBody = fs.readFileSync('context_pr_review.md', 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find(c => c.body.includes('ContextPR: Semantic Blast-Radius'));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: reviewBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: reviewBody,
                });
              }
            }
