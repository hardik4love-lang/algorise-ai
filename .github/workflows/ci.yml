name: Algorise AI Engine CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio
        pip install -e .


    - name: Syntax & Import Verification
      run: |
        python -m py_compile engine/main.py engine/security.py engine/subscription_routes.py engine/hero_registry.py engine/scheduler.py engine/cache.py
        python -c "from engine.main import app, HERO_BOT_DEFINITIONS; assert len(HERO_BOT_DEFINITIONS) == 100; print('CI VERIFICATION: App initialized successfully with', len(app.routes), 'routes and', len(HERO_BOT_DEFINITIONS), 'Hero Bots')"

    # Previously CI ran neither tests nor the web build, despite pytest,
    # ruff, mypy and a --cov-fail-under=80 gate all being configured in
    # pyproject.toml. The build check is what stops dist/ drifting again:
    # dist/ is generated and untracked, so staleness must be detectable.

    - name: Test Suite
      run: |
        python -m pytest tests/ -q -o addopts=""

    - name: Web Build Check
      env:
        API_BASE_URL: https://algorise-ai-backend.onrender.com
      run: |
        python scripts/build.py
        python scripts/build.py --check-all

    - name: Dependency Coverage Check
      # The container installs from pyproject while Render installs from
      # requirements.txt. A module imported by the engine but missing from
      # the installed set raises ImportError at startup.
      run: python scripts/check_dependency_coverage.py

    - name: Dependency Parity Check
      # The two dependency sets must declare the same pinned versions, or
      # the image and the deployed service run different libraries.
      run: python scripts/check_dependency_parity.py

    - name: Route Registration Check
      # A router that fails to import is swallowed by the lazy loader. The
      # build then succeeds and the service serves a subset of the API
      # while reporting healthy. This makes the route table explicit.
      #
      # The OpenAPI schema is the authoritative view of what the service
      # serves. FastAPI 0.159 keeps an included router as a single entry
      # instead of copying its routes into app.routes, so a flat scan
      # undercounts on that release.
      run: |
        python scripts/dump_routes.py | tee /tmp/routes.txt
        openapi_count=$(grep -oP 'ROUTE_OPENAPI_COUNT=\K[0-9]+' /tmp/routes.txt)
        walk_count=$(grep -oP 'ROUTE_COUNT=\K[0-9]+' /tmp/routes.txt)
        missing=$(grep -oP 'ROUTE_WALK_MISSING=\K.*' /tmp/routes.txt)
        echo "routes in the OpenAPI schema: $openapi_count"
        echo "routes found by the walk:       $walk_count"
        if [ -n "$missing" ]; then
          echo "::error::the route walk missed paths served by the app: $missing"
          exit 1
        fi
        if [ "$openapi_count" -lt 60 ]; then
          echo "::error::only $openapi_count routes served, routers are failing to import"
          exit 1
        fi
        if [ "$walk_count" -lt 60 ]; then
          echo "::error::route walk found only $walk_count paths"
          exit 1
        fi

    - name: Release Gates (offline subset)
      # Network gates are skipped in CI; the source-level gates are the ones
      # that can fail on a pull request.
      run: |
        python -c "
        import sys; sys.path.insert(0, 'scripts')
        import release
        gates = [release.gate_no_hardcoded_hosts, release.gate_config_injected, release.gate_no_credentials_in_client, release.gate_dist_not_tracked]
        failed = 0
        for fn in gates:
            g = fn()
            print(('  PASS  ' if g.passed else '  FAIL  ') + g.name + ' — ' + g.detail)
            failed += 0 if g.passed else 1
        sys.exit(failed)
        "
