name: "AutoTest Sentinel: Flaky Test Quarantine & DevEx Sentry"

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      quarantine_threshold:
        description: 'Bayesian flakiness threshold for auto-quarantine (0.0 - 1.0)'
        required: false
        default: '0.75'

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  sentinel-guard:
    name: "Autonomous Test Sentry & DevEx Optimization"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Runtime & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Step 1 - AST Anti-Pattern Audit
        run: |
          echo "Scanning test files for timing jitter and non-deterministic anti-patterns..."
          python -m autotest_sentinel.cli scan --dir .

      - name: Step 2 - Execute Pytest with AutoTest Sentinel Isolation
        id: test_execution
        continue-on-error: true
        run: |
          mkdir -p .autotest
          python -m pytest -p autotest_sentinel.pytest_plugin --autotest-quarantine -o addopts="" || echo "TEST_FAILED=1" >> $GITHUB_ENV

      - name: Step 3 - Statistical Bayesian Analysis & Flakiness Evaluation
        if: always()
        run: |
          if [ -f .autotest/telemetry.json ]; then
            python -m autotest_sentinel.cli analyze --telemetry .autotest/telemetry.json
          else
            echo "No telemetry generated in current run; skipping classifier."
          fi

      - name: Step 4 - Autonomous Quarantine Enforcement
        if: always()
        run: |
          if [ -f .autotest/telemetry.json ]; then
            python -m autotest_sentinel.cli quarantine \
              --telemetry .autotest/telemetry.json \
              --threshold ${{ github.event.inputs.quarantine_threshold || '0.75' }}
          fi

      - name: Step 5 - Generate Executive DevEx & Compute Savings Report
        if: always()
        run: |
          python -m autotest_sentinel.cli report --output report_summary.md
          cat report_summary.md >> $GITHUB_STEP_SUMMARY
          cat report_summary.md

      - name: Step 6 - Commit Quarantine State (Master Only)
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        run: |
          git config user.name "autotest-sentinel[bot]"
          git config user.email "sentinel@algorise.ai"
          if [ -f .autotest/quarantine.json ]; then
            git add .autotest/quarantine.json
            git diff-index --quiet HEAD || git commit -m "chore(ci): auto-quarantine flaky test registry [skip ci]"
            git push origin master || echo "Quarantine commit push skipped or no changes"
          fi
