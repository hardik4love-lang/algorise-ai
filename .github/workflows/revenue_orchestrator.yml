name: Revenue Orchestrator Autonomous Scan

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours (free within GitHub Actions runner limits)
  workflow_dispatch:
    inputs:
      target_query:
        description: 'GitHub search query for opportunities'
        required: false
        default: 'bounty'
      enforce_zero_cost:
        description: 'Enforce strict $0.00 cost limit'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  orchestrate-revenue:
    name: Autonomous Revenue Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Quota & Rate Limits
        id: quota-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAINING=$(gh api rate_limit --jq '.resources.core.remaining' 2>/dev/null || echo "5000")
          echo "GitHub API core quota remaining: $REMAINING"
          if [ "$REMAINING" -lt 50 ]; then
            echo "API quota below safe threshold (< 50). Tripping circuit breaker."
            exit 1
          fi

      - name: Scan & Evaluate Opportunities via DevEx Revenue Engine
        id: evaluate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_QUERY: ${{ inputs.target_query || 'bounty' }}
        run: |
          python -m devex revenue scan \
            --query "$TARGET_QUERY" \
            --limit 10 \
            --ledger "live_ledger/evaluation_ledger.json" \
            --output "revenue_summary.md"
          cat revenue_summary.md >> $GITHUB_STEP_SUMMARY
          cat revenue_summary.md

      - name: Upload Economic & Audit Ledger
        uses: actions/upload-artifact@v4
        with:
          name: revenue-orchestrator-ledger
          path: live_ledger/evaluation_ledger.json
          retention-days: 7

      - name: Commit Updated Audit Ledger
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "revenue-orchestrator[bot]"
          git config user.email "orchestrator@algorise.ai"
          git add live_ledger/evaluation_ledger.json
          git diff-index --quiet HEAD || git commit -m "chore(audit): update revenue evaluation ledger [skip ci]"
          git push origin master || echo "Push skipped or no changes"
