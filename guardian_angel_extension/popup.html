<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Guardian Angel</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background: #070a13;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .shield-icon {
      width: 28px;
      height: 28px;
      background: #06b6d4;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    .title {
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    .status-badge {
      display: inline-block;
      padding: 4px 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10b981;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .input-box {
      width: 100%;
      box-sizing: border-box;
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .scan-btn {
      width: 100%;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #000;
      border: none;
      padding: 9px;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      font-size: 12px;
    }
    .result {
      margin-top: 10px;
      font-size: 11px;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="shield-icon">🛡️</div>
    <div class="title">GUARDIAN ANGEL™</div>
  </div>

  <div class="status-badge">● SENTINEL ACTIVE (UK/US)</div>

  <div style="font-size: 11px; color: #94a3b8; margin-bottom: 8px;">Quick Link / Text Scanner:</div>
  <input type="text" id="quick-input" placeholder="Paste link or text snippet..." class="input-box" />
  <button id="quick-scan-btn" class="scan-btn">Analyze Threat</button>

  <div id="quick-result" class="result"></div>

  <div style="margin-top: 14px; text-align: center; font-size: 10px; color: #64748b; border-top: 1px solid #1e293b; pt-2;">
    Family Angel Co-Pilot: <strong>CONNECTED</strong>
  </div>

  <script src="popup.js"></script>
</body>
</html>
