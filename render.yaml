services:
  - type: web
    name: algorise-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn engine.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "Algorise AI Solutions"
      - key: TELEGRAM_BOT_TOKEN
        value: "REDACTED_ROTATE_VIA_BOTFATHER"
      - key: TELEGRAM_CHAT_ID
        value: "8737013099"
