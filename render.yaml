databases:
  - name: algorise-postgres
    databaseName: algorise_db
    user: algorise_admin
    plan: starter

services:
  - type: web
    name: algorise-ai-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && npm install --no-audit --no-fund && python scripts/build.py
    startCommand: uvicorn engine.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /readyz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: APP_NAME
        value: "Algorise AI Solutions"
      - key: LOG_LEVEL
        value: INFO
      - key: MIGRATE_ON_START
        value: "false"
      - key: REDIS_REQUIRED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://algorise-ai.com,https://www.algorise-ai.com,https://algorise.ai,https://www.algorise.ai,https://shruhicollections.in,https://www.shruhicollections.in,https://hardik4love-lang.github.io,https://algorise-ai-backend.onrender.com"
      - key: ENFORCE_PRODUCTION_SECURITY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: algorise-postgres
          property: connectionString
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
