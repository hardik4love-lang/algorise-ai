apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: algorise-ai-engine
  namespace: algorise-prod
  labels:
    app.kubernetes.io/name: algorise-ai
    app.kubernetes.io/part-of: algorise-ecosystem
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: algorise-ai
  strategy:
    canary:
      canaryService: algorise-ai-canary
      stableService: algorise-ai-stable
      trafficRouting:
        cilium: {} # Native Cilium eBPF L7 route manipulation
      steps:
        - setWeight: 10
        - pause: { duration: 5m }
        - setWeight: 25
        - pause: { duration: 10m }
        - setWeight: 50
        - pause: { duration: 10m }
      analysis:
        templates:
          - templateName: error-rate-and-latency-analysis
        args:
          - name: service-name
            value: algorise-ai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: algorise-ai
      annotations:
        instrumentation.opentelemetry.io/inject-python: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: algorise-workload-identity
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: algorise-ai
      containers:
        - name: engine
          image: ghcr.io/hardik4love-lang/algorise-ai:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: algorise-ai-config
            - secretRef:
                name: algorise-ai-secrets
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector-gateway.telemetry.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "algorise-ai-engine"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Liveness only proves the process is alive. Readiness proves the
          # service finished startup and its dependencies are usable. The
          # startup probe gates traffic until the first successful readiness
          # evaluation, so a slow start is never misread as a crash.
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2

          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: algorise-ai
  namespace: algorise-prod
  labels:
    app.kubernetes.io/name: algorise-ai
    app.kubernetes.io/managed-by: argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: algorise-ai
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
