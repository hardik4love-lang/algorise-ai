apiVersion: v1
kind: ServiceAccount
metadata:
  name: algorise-workload-identity
  namespace: algorise-prod
  labels:
    app.kubernetes.io/name: algorise-ai
    app.kubernetes.io/part-of: algorise-ecosystem
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: algorise-ai-config
  namespace: algorise-prod
  labels:
    app.kubernetes.io/name: algorise-ai
data:
  ENVIRONMENT: "production"
  APP_NAME: "Algorise AI Solutions"
  LOG_LEVEL: "INFO"
  API_HOST: "0.0.0.0"
  API_PORT: "8000"
  OTEL_SERVICE_NAME: "algorise-ai-engine"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-gateway.telemetry.svc.cluster.local:4317"
  OTEL_TRACES_SAMPLER: "parentbased_traceidratio"
  OTEL_TRACES_SAMPLER_ARG: "0.1"
  PROMETHEUS_PORT: "9090"
  CORS_ALLOWED_ORIGINS: "https://algorise-ai.com,https://www.algorise-ai.com"
  MIGRATE_ON_START: "false"
  REDIS_REQUIRED: "true"
  ENABLE_EMBEDDED_SCHEDULER: "false"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: algorise-ai-secrets
  namespace: algorise-prod
  labels:
    app.kubernetes.io/name: algorise-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: algorise-secret-store
    kind: ClusterSecretStore
  target:
    name: algorise-ai-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: algorise-ai/production
        property: database_url
    - secretKey: REDIS_URL
      remoteRef:
        key: algorise-ai/production
        property: redis_url
    - secretKey: SECRET_KEY
      remoteRef:
        key: algorise-ai/production
        property: secret_key
    - secretKey: ADMIN_SECRET
      remoteRef:
        key: algorise-ai/production
        property: admin_secret
    - secretKey: ALGORISE_TENANT_REGISTRY
      remoteRef:
        key: algorise-ai/production
        property: tenant_registry
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: algorise-ai/production
        property: telegram_bot_token
    - secretKey: META_APP_SECRET
      remoteRef:
        key: algorise-ai/production
        property: meta_app_secret
    - secretKey: GITHUB_APP_PRIVATE_KEY
      remoteRef:
        key: algorise-ai/production
        property: github_app_private_key
    - secretKey: GITHUB_WEBHOOK_SECRET
      remoteRef:
        key: algorise-ai/production
        property: github_webhook_secret
    - secretKey: LLM_API_KEY
      remoteRef:
        key: algorise-ai/production
        property: llm_api_key
