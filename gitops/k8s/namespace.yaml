apiVersion: v1
kind: Namespace
metadata:
  name: algorise-prod
  labels:
    app.kubernetes.io/part-of: algorise-ecosystem
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: algorise-prod-quota
  namespace: algorise-prod
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "10"
    pods: "60"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: algorise-prod-limits
  namespace: algorise-prod
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
