  - rollout.yaml
  - service.yaml
  - pdb.yaml
  - secrets.yaml
  - migration-job.yaml
  - networkpolicy.yaml
  - keda-scaledobject.yaml
  - kyverno-policies.yaml
  - analysis-template.yaml
