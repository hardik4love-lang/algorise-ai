apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: algorise-ai-autoscaler
  namespace: algorise-prod
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: algorise-ai-engine
  pollingInterval: 15
  cooldownPeriod: 180
  minReplicaCount: 2
  maxReplicaCount: 15
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Percent
              value: 100
              periodSeconds: 15
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 10
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://victoriametrics.telemetry.svc.cluster.local:8428
        metricName: http_requests_per_second
        threshold: "75"
        query: sum(rate(http_requests_total{app="algorise-ai"}[1m]))
