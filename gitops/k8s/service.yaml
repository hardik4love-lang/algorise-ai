apiVersion: v1
kind: Service
metadata:
  name: algorise-ai-stable
  namespace: algorise-prod
  labels:
    app.kubernetes.io/name: algorise-ai
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: algorise-ai
---
apiVersion: v1
kind: Service
metadata:
  name: algorise-ai-canary
  namespace: algorise-prod
  labels:
    app.kubernetes.io/name: algorise-ai
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: algorise-ai
