apiVersion: apps/v1
kind: Deployment
metadata:
  name: predictive-anomaly-forecaster
  namespace: algorise-prod
  labels:
    app.kubernetes.io/name: predictive-anomaly-forecaster
    app.kubernetes.io/part-of: algorise-ai-ecosystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: predictive-anomaly-forecaster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: predictive-anomaly-forecaster
    spec:
      serviceAccountName: algorise-remediation-sa
      containers:
        - name: forecaster
          image: ghcr.io/hardik4love-lang/aiops-anomaly-forecaster:v1.0.0
          env:
            - name: TELEMETRY_SERVER
              value: "http://victoriametrics.telemetry.svc.cluster.local:8428"
            - name: FORECAST_HORIZON_MINUTES
              value: "30"
            - name: PREDICTION_CONFIDENCE_THRESHOLD
              value: "0.92"
            - name: TARGET_WORKLOAD
              value: "algorise-ai-engine"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
