apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-gateway-config
  namespace: telemetry
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 80
        spike_limit_percentage: 20

      batch:
        send_batch_size: 8192
        timeout: 1s

      resource:
        attributes:
          - key: environment
            value: production
            action: insert

      tail_sampling:
        decision_wait: 10s
        num_traces: 10000
        expected_new_traces_per_sec: 2000
        policies:
          # Always capture traces with error status
          - name: error-status-policy
            type: status_code
            status_code: { status_codes: [ERROR] }
          # Always capture high latency outliers (> 500ms)
          - name: high-latency-policy
            type: latency
            latency: { threshold_ms: 500 }
          # Probabilistic sample 1% of normal 2xx traffic
          - name: probabilistic-sampling-policy
            type: probabilistic
            probabilistic: { sampling_percentage: 1.0 }

    exporters:
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: "algorise"
        send_timestamps: true

      otlp/tempo:
        endpoint: "tempo-distributor.telemetry.svc.cluster.local:4317"
        tls:
          insecure: true

      otlp/clickhouse:
        endpoint: "clickhouse-collector.telemetry.svc.cluster.local:4317"
        tls:
          insecure: true

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, tail_sampling, batch, resource]
          exporters: [otlp/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [prometheus]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlp/clickhouse]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-gateway
  namespace: telemetry
  labels:
    app.kubernetes.io/name: opentelemetry-collector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: opentelemetry-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentelemetry-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otelcol/otel-collector-config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8889
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          configMap:
            name: otel-collector-gateway-config
