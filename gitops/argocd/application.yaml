apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: algorise-ai-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/hardik4love-lang/algorise-ai.git
    targetRevision: master
    path: gitops/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: algorise-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
