[project]
name = "algorise-ai"
version = "1.0.0"
description = "Algorise AI Solutions - 100 Hero Bots & Autoflow Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "httpx>=0.26.0",
    "tenacity==9.2.1",
    "structlog>=24.1.0",
    "python-dotenv==1.2.4",
]

[project.scripts]
algorise-devex = "devex.cli:main"
devex = "devex.cli:main"

[project.optional-dependencies]
# These pins must stay identical to requirements.txt. The Docker image
# installs from this file while Render installs from requirements.txt, so
# any drift between the two produces an image that behaves differently
# from the deployed service. A clean install of the unpinned ranges
# resolved SQLAlchemy 2.1.6, which the OpenTelemetry SQLAlchemy
# instrumentor does not support, and the service failed to start.
server = [
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "asyncpg==0.32.0",
    "cryptography==50.0.2",
    "email-validator==2.3.0",
    "fastapi==0.159.1",
    "greenlet==3.5.6",
    "httpx==0.28.1",
    "loguru==0.7.3",
    "opentelemetry-api==1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-redis==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "opentelemetry-sdk==1.45.1",
    "passlib[bcrypt]==1.7.4",
    "prometheus-client==0.26.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "python-dotenv==1.2.4",
    "python-jose[cryptography]==3.5.0",
    "python-json-logger==4.2.0",
    "python-multipart==0.0.32",
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "requests==2.34.2",
    "sqlalchemy[asyncio]==2.0.55",
    "structlog==26.1.0",
    "telethon==1.45.0",
    "tenacity==9.2.1",
    "uvicorn[standard]==0.54.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
    "types-requests>=2.31.0",
    "types-redis>=5.0.0",
    "black>=24.1.0",
    "isort>=5.13.0",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["engine*", "solvers*", "autotest_sentinel*", "context_pr*", "modernize_ai*", "trace_root_ai*", "devex*"]
exclude = ["tests*", "node_modules*", "dist*", "build*", "data*", "assets*", "leads*", "live_ledger*", "gitops*", "industry*", "compare*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PTH", # flake8-use-pathlib
    "T20", # flake8-print
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default arguments
    "ARG001", # unused argument (common in handlers)
    "ARG002", # unused argument (common in handlers)
]
per-file-ignores = { "test_*.py" = ["S101", "T201"], "engine/__init__.py" = [] }
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "env",
    "dist",
    "build",
    "*.egg-info",
    "algorise-ai-production-package",
    "dist",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "engine.*",
    "solvers.*",
]
strict = true

[[tool.mypy.overrides]]
module = "test_*"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-v",
    "--tb=short",
    "--cov=engine",
    "--cov=solvers",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''/(\.git|\.venv|venv|env|dist|build|\.egg-info|algorise-ai-production-package|dist)/'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
known_first_party = ["engine", "solvers"]

[tool.coverage.run]
source = ["engine", "solvers"]
omit = [
    "test_*.py",
    "*_test.py",
    "*/__pycache__/*",
    "algorise-ai-production-package/*",
    "dist/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
precision = 2

[tool.pre-commit-hooks]
# This section is for reference; actual hooks in .pre-commit-config.yaml